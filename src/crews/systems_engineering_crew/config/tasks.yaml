create_requirements:
  description: >
    Your task is to assess the user_input {user_input} and convert it into a technical requirement for use by design engineer in conceptual design. You should use the knowledge source showing important concepts related to airfoil design and development in the form of a graph presented as a csv table with node_1 (concept from ontology), node_2 (related concept from ontology), relationship between node_1 and node_2. Use this graph to identify important considerations for new airfoil design and development. Be specific about the functional and non-functional requirements based on user_input and your prior knowledge. Restrict these requirements to be specific to the 4-series NACA airfoils with design limits of max_camber: [0.01, 0.095], camber_loc: [0.05, 0.9], thickness: [0.01, 0.40]. Focus on how to provide a technical description of the product requirements. Provide clear constraints on any design parameters, operating conditions that will be useful for a design engineer. The requirements should focus on the design parameters that are critical for airfoil designing. 
    Your final response must include:
    - Functional_req: Bullet list of functional requirements including specifications, geometry parameters of interest and the design space available
    - Non_functional_req: Bullet list of non-functional requirements such as manufacturability, performance, aesthetic that are related to design parameters
  expected_output: >
    Functional_req: Bullet list of functional requirements
    Non_functional_req: Bullet list of non-functional requirements
  markdown: True
  output_file: ./design_requirements/requirements.md
  create_directory: True
  agent: systems_engineer

