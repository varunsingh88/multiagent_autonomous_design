verify_designs:
  description: >
    Your task is to analyze the image_file which shows an airfoil profile along with analytical aerodynamic data CD: {CD}, CL: {CL}, CM: {CM}, and geometric parameters: camber:{camber}, camber_location:{camber_loc}, thickness:{thickness} of airfoil shapes provided and assess the suitability of each profile based on knowledge source availabe to you. Ensure that you analyze the airfoil profile, aerodynamic data and geometric parameters to create a comprehensive response. Assume the aerodynamic data is accurate and analyze the image from the perspective of design review of the shape.
    
    You should also include any human input when provided during this process and include it in your response. You will also receive an iteration number {iter_num} that indicates the number of design review steps that have been accomplished which you should use to create the output_file containing the reviews. Additionally, you will also receive a {Design_ID} that helps identify the design number you need to review.
    
    Here are the things you should consider:
    - Is the airfoil profile shown in the provided image suitable to meet the technical requirements {engg_requirements}?
    - Is the airfoil profile provided in the image follow general design conventions based on your knowledge?
    - Are the design parameters provided conventionally used for airfoil design? How choices of these design parameters affect airfoil's performance and suitability?
    - How does this airfoil design fulfil the non-functional requirements provided within the {engg_requirements}?
    - Does the design satisfy NACA parameter limits: max_camber: [0.01, 0.095], camber_loc: [0.1, 0.9], thickness: [0.06, 0.40]?
    - How can the design be improved further to meet the product requirements?
    - Is the Cl value less than 0.5? If yes, the design is considered invalid as a rule of thumb.    
    
    Your final response must include:
    - Design_ID: {Design_ID}
    - Feedback: Provide a summarized review on your assesment of the airfoil shape based on its profile by combining image analysis (atleast 2 lines), aerodynamic performance, and parameter values provided (3-5 lines). Include suggestions for improving design through better choice of design parameters or profile modifications along with any human_input when available that you see relevant. Include the design parameters for the existing design as a reference while creating your feedback for the design team. 
    - Valid: Status of current design in meeting {engg_requirements} based on your judgement(True/False). Mark design as False only when you are 100% sure that it will not meet requirements.
  expected_output: >
    Design_ID: Filename
    Feedback: Summary of design review and design improvement suggestions in 5-6 lines
    Valid: True/False
  markdown: True
  output_file: ./design_review/design_assessment_{Design_ID}_{iter_num}.md
  create_directory: True
  agent: systems_engineer
  human_input: False

